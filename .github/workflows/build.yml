name: Build SD card package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space (the GCC toolchain image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the QNX toolchain
        run: git clone --depth 1 https://github.com/luka-dev/qnx65-armv7-toolchain ../qnx65-armv7-toolchain

      - name: Build the toolchain image (slow the first time, compiles GCC)
        working-directory: ../qnx65-armv7-toolchain
        run: ./host-scripts/qnx-run.sh build 8.5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build everything
        run: ./build_local.sh

      - name: Upload SD card files and release zip
        uses: actions/upload-artifact@v4
        with:
          name: mib-cluster-map-build
          path: dist/

      - name: Publish GitHub Release (compiled zip, not source)
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            dist/mib-cluster-map_*.zip
            dist/mib-cluster-map_*.sha256
